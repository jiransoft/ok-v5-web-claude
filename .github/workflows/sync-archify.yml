# 매주 월요일 09:00 KST 에 archify 업스트림의 최신 안정 릴리즈를 확인하고, 벤더 버전보다 새로우면
# scripts/sync-archify.sh 로 동기화한 뒤 검사 결과를 담은 PR 을 자동으로 연다. 사람은 리뷰·머지만 한다.
#
# 전제: PR 생성 단계는 두 경로 중 하나가 필요하다.
#   (a) 저장소 시크릿 SYNC_ARCHIFY_TOKEN — 이 저장소에 contents·pull-requests 쓰기 권한이 있는
#       fine-grained PAT. 조직이 "Allow GitHub Actions to create and approve pull requests" 를
#       막아 둔 경우(jiransoft 조직이 그렇다) 이 경로만 동작하며, 이 토큰으로 만든 PR 은 ci.yml 도 깨운다.
#   (b) 조직·저장소 설정에서 위 항목을 허용 — 그러면 기본 GITHUB_TOKEN 으로도 PR 이 만들어진다.
#   둘 다 없으면 브랜치만 푸시하고, PR 을 한 번에 열 수 있는 compare 링크를 담은 이슈를 만든다.
# 제약: 기본 GITHUB_TOKEN 으로 만든 PR 은 pull_request 워크플로우(ci.yml)를 깨우지 않는다.
#       그래서 같은 검사를 여기서 먼저 돌리고 결과를 PR 본문에 적는다.
name: Sync archify engine

on:
  schedule:
    # UTC 00:00 = 월요일 09:00 KST. 정각은 Actions 가 붐벼 수십 분 늦게 시작할 수 있다.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: '동기화할 업스트림 참조 (예: v2.17.0). 비우면 최신 안정 태그를 조회한다'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write   # PR 생성이 정책에 막힐 때 이슈로 대체 알림

concurrency:
  group: sync-archify
  cancel-in-progress: false

env:
  UPSTREAM_REPO: tt-a1i/archify
  # 저장소 협업자 계정이어야 한다. PAT 소유자와 같은 계정이면 GitHub 이 셀프 리뷰 요청을 거부하므로 실패해도 PR 은 유지한다.
  REVIEWER: jiran-donghun

jobs:
  sync:
    name: 업스트림 안정 태그 확인 → 동기화 PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 현재 벤더 버전과 업스트림 최신 안정 태그 비교
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./plugins/arch-tools/archify/package.json').version")"
          if [ -n "$INPUT_REF" ]; then
            target="$INPUT_REF"
          else
            target="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')"
          fi
          candidate="${target#v}"
          if [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            newer="$(node scripts/semver-newer.mjs "$current" "$candidate")"
          else
            newer="true"   # 버전 형식이 아닌 참조(SHA)는 수동 실행에서만 오므로 그대로 진행한다
          fi
          {
            echo "current=${current}"
            echo "target=${target}"
            echo "newer=${newer}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## archify 엔진 동기화 점검"
            echo
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 현재 벤더 버전 | \`${current}\` |"
            echo "| 업스트림 대상 | \`${target}\` |"
            echo "| 동기화 필요 | ${newer} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 변화 없음
        if: steps.probe.outputs.newer != 'true'
        env:
          CURRENT: ${{ steps.probe.outputs.current }}
          TARGET: ${{ steps.probe.outputs.target }}
        run: echo "현재 벤더 버전 ${CURRENT} 이 업스트림 ${TARGET} 이상이다. 할 일 없음."

      - name: 동기화 실행
        if: steps.probe.outputs.newer == 'true'
        env:
          TARGET: ${{ steps.probe.outputs.target }}
        run: scripts/sync-archify.sh "$TARGET"

      - name: 변경 여부 확인
        if: steps.probe.outputs.newer == 'true'
        id: diff
        run: |
          set -euo pipefail
          git add -A plugins/arch-tools/archify
          # UPSTREAM.md 는 시각이 바뀌어 항상 달라진다 — 엔진 파일 기준으로 판단한다
          if git diff --cached --quiet -- plugins/arch-tools/archify ':(exclude)plugins/arch-tools/archify/UPSTREAM.md'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "엔진 파일에 변화가 없다 (이미 동기화됨)" >> "$GITHUB_STEP_SUMMARY"
            git reset -q
            git checkout -q -- plugins/arch-tools/archify
            exit 0
          fi
          skill_changed=false
          notices_changed=false
          git diff --cached --quiet -- plugins/arch-tools/archify/SKILL.md || skill_changed=true
          git diff --cached --quiet -- plugins/arch-tools/archify/THIRD_PARTY_NOTICES.md || notices_changed=true
          git diff --cached --stat > /tmp/diffstat.txt
          {
            echo "changed=true"
            echo "skill_changed=${skill_changed}"
            echo "notices_changed=${notices_changed}"
          } >> "$GITHUB_OUTPUT"

      - name: 검사 (lint · preflight · 엔진 doctor · 예제 validate)
        if: steps.diff.outputs.changed == 'true'
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            python3 scripts/lint-skills.py --warn-ok
            python3 scripts/preflight.py --deep
            scripts/verify-archify-engine.sh
          } 2>&1 | tee /tmp/verify.txt

      - name: 업스트림 CHANGELOG 절 추출
        if: steps.diff.outputs.changed == 'true'
        env:
          TARGET: ${{ steps.probe.outputs.target }}
        run: |
          set -euo pipefail
          version="${TARGET#v}"
          : > /tmp/changelog-section.md
          if curl -fsSL "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${TARGET}/CHANGELOG.md" -o /tmp/CHANGELOG.md; then
            awk -v ver="$version" 'index($0, "## [" ver "]") == 1 { f = 1; print; next } /^## \[/ { if (f) exit } f' \
              /tmp/CHANGELOG.md > /tmp/changelog-section.md || true
          fi
          if [ ! -s /tmp/changelog-section.md ]; then
            echo "_CHANGELOG 절을 찾지 못했다. 업스트림 릴리즈 노트를 직접 확인한다._" > /tmp/changelog-section.md
          fi

      - name: 브랜치 푸시 + PR 생성 또는 갱신
        if: steps.diff.outputs.changed == 'true'
        env:
          # 시크릿이 있으면 PAT 로 PR 을 만든다 (조직 정책 우회 + ci.yml 트리거). 없으면 기본 토큰.
          GH_TOKEN: ${{ secrets.SYNC_ARCHIFY_TOKEN || github.token }}
          TARGET: ${{ steps.probe.outputs.target }}
          CURRENT: ${{ steps.probe.outputs.current }}
          SKILL_CHANGED: ${{ steps.diff.outputs.skill_changed }}
          NOTICES_CHANGED: ${{ steps.diff.outputs.notices_changed }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          branch="chore/sync-archify-${TARGET}"
          title="chore(arch-tools): archify 엔진 ${TARGET} 동기화"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "$title" -m "scripts/sync-archify.sh ${TARGET} 자동 실행 결과. 이전 버전 ${CURRENT}. 검사: ${VERIFY_OUTCOME}."
          git fetch -q origin "$branch" || true
          git push --force-with-lease origin "$branch"

          {
            echo "## archify 엔진 동기화: \`${CURRENT}\` → \`${TARGET}\`"
            echo
            echo "매주 월요일 점검 워크플로우가 \`scripts/sync-archify.sh ${TARGET}\` 를 실행해 만든 PR 입니다."
            echo "벤더 파일은 업스트림 배포본과 같고, 제외 목록과 출처는 \`plugins/arch-tools/archify/UPSTREAM.md\` 에 있습니다."
            echo
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 검사 (lint · preflight · 엔진 doctor · 예제 validate) | **${VERIFY_OUTCOME}** |"
            echo "| 업스트림 SKILL.md 변경 | ${SKILL_CHANGED} |"
            echo "| THIRD_PARTY_NOTICES 변경 | ${NOTICES_CHANGED} |"
            echo "| 업스트림 릴리즈 | https://github.com/${UPSTREAM_REPO}/releases/tag/${TARGET} |"
            echo
            echo "### 리뷰 체크리스트"
            echo "- [ ] 아래 CHANGELOG 절을 읽었다"
            echo "- [ ] 업스트림 SKILL.md 변경이 있으면 diff 를 보고 \`plugins/arch-tools/skills/struct/SKILL.md\` 반영 여부를 판단했다"
            echo "- [ ] 로컬에서 \`/arch-tools:struct\` 를 1회 실행해 HTML 이 생성되는 것을 확인했다"
            echo "- [ ] THIRD_PARTY_NOTICES 변경이 있으면 고지 내용을 확인했다"
            echo
            echo "### 변경 파일"
            echo '```'
            cat /tmp/diffstat.txt
            echo '```'
            echo
            echo "### 업스트림 CHANGELOG"
            cat /tmp/changelog-section.md
            echo
            echo "### 검사 로그"
            echo '```'
            cat /tmp/verify.txt
            echo '```'
          } > /tmp/pr-body.md

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file /tmp/pr-body.md
            gh pr comment "$existing" --body "브랜치를 최신 실행 결과로 갱신했습니다 (검사: ${VERIFY_OUTCOME})."
          elif gh pr create --base main --head "$branch" --title "$title" --body-file /tmp/pr-body.md 2>/tmp/pr-create.err; then
            :
          else
            # 조직이 Actions 의 PR 생성을 막았고 PAT 시크릿도 없는 경우다. 브랜치는 이미 푸시됐으므로
            # 이슈로 알리고 한 번에 PR 을 열 수 있는 compare 링크를 담는다. 이슈 생성은 정책에 막히지 않는다.
            echo "PR 생성 실패, 이슈로 대체: $(cat /tmp/pr-create.err)" >> "$GITHUB_STEP_SUMMARY"
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            {
              echo "브랜치 \`${branch}\` 를 푸시했지만 Actions 의 PR 생성이 조직 정책으로 막혀 있습니다."
              echo
              echo "**→ [이 링크를 눌러 PR 을 여세요](${compare_url})** (제목: \`${title}\`)"
              echo
              echo "PR 을 열면 ci.yml 이 실행됩니다. 아래는 PR 본문으로 쓸 내용입니다."
              echo
              echo "---"
              cat /tmp/pr-body.md
            } > /tmp/issue-body.md
            issue_title="[sync-archify] ${TARGET} 동기화 브랜치 준비됨 — PR 열어 주세요"
            existing_issue="$(gh issue list --state open --search "in:title \"[sync-archify] ${TARGET}\"" --json number --jq '.[0].number // empty')"
            if [ -n "$existing_issue" ]; then
              gh issue edit "$existing_issue" --body-file /tmp/issue-body.md
              gh issue comment "$existing_issue" --body "브랜치를 최신 실행 결과로 갱신했습니다 (검사: ${VERIFY_OUTCOME})."
              echo "이슈 갱신: $(gh issue view "$existing_issue" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
            else
              url="$(gh issue create --title "$issue_title" --body-file /tmp/issue-body.md --assignee "$REVIEWER" 2>/dev/null \
                || gh issue create --title "$issue_title" --body-file /tmp/issue-body.md)"
              echo "이슈 생성: ${url}" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          # 리뷰어 지정은 보조 단계다. PR 작성자와 같은 계정이면 거부되므로 실패를 PR 실패로 번지게 하지 않는다.
          if ! gh pr edit "$branch" --add-reviewer "$REVIEWER" 2>/tmp/reviewer.err; then
            echo "리뷰어 ${REVIEWER} 지정 실패: $(cat /tmp/reviewer.err)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "PR: $(gh pr view "$branch" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
